name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build, bundle budget)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Check entry bundle budget (D-013)
        run: npm run check:bundle

  worker:
    name: Worker (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/r2-storage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: workers/r2-storage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npx tsc --noEmit
