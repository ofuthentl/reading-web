<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfbf8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ofu's Library" />
    <title>Ofu's Library</title>
    <link rel="icon" type="image/png" href="%BASE_URL%logo-128.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ofu-library-theme');
          var theme =
            raw === 'light' || raw === 'noon' || raw === 'dim' || raw === 'midnight'
              ? raw
              : raw === 'dark'
                ? 'dim'
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dim'
                  : 'light';
          var root = document.documentElement;
          root.dataset.theme = theme;
          if (theme === 'dim' || theme === 'midnight') {
            root.classList.add('dark');
          }
          var colors = {
            light: '#fcfbf8',
            noon: '#f6f1e7',
            dim: '#0d1117',
            midnight: '#060608',
          };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', colors[theme] || '#fcfbf8');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
